apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gpu-inference-dev
resources:
  - ../../base
  - namespace.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: gpu-platform
      app.kubernetes.io/environment: dev
      app.kubernetes.io/managed-by: kustomize
# No `images:` block. The account ID and image tag are supplied at deploy time:
#
#   kustomize edit set image vllm/vllm-openai=<registry>/<repo>:<tag>
#
# This previously pinned 861097501858.dkr.ecr.us-east-1.amazonaws.com with
# newTag: latest. That hardcoded one AWS account into the repo, and nothing ever
# pushed a `latest` tag, so `kubectl apply -k` rendered an unpullable image and
# relied on a follow-up `kubectl set image` to recover.
patches:
  - target:
      kind: ConfigMap
      name: gpu-inference-config
    patch: |-
      - op: replace
        path: /data/GPU_MEMORY_UTILIZATION
        value: "0.90"
      - op: replace
        path: /data/MAX_MODEL_LEN
        value: "4096"
