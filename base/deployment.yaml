apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-inference
  labels:
    app.kubernetes.io/name: gpu-inference
    app.kubernetes.io/component: inference
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gpu-inference
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gpu-inference
        app.kubernetes.io/component: inference
    spec:
      serviceAccountName: gpu-inference
      terminationGracePeriodSeconds: 60
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vllm
          image: vllm/vllm-openai
          imagePullPolicy: IfNotPresent
          command:
            - vllm
            - serve
          args:
            - $(MODEL_NAME)
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --download-dir
            - /models
            - --gpu-memory-utilization
            - $(GPU_MEMORY_UTILIZATION)
            - --max-model-len
            - $(MAX_MODEL_LEN)
            - --tensor-parallel-size
            - $(TENSOR_PARALLEL_SIZE)
          envFrom:
            - configMapRef:
                name: gpu-inference-config
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: huggingface-token
                  key: HF_TOKEN
                  optional: true
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: model-cache
              mountPath: /models
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
